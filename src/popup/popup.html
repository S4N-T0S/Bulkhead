<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../ui/base.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="row">
    <svg class="hatch" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
      <circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="8" cy="8" r="2.1" fill="currentColor"/>
    </svg>
    <strong>Bulkhead</strong>
    <span class="grow"></span>
    <button id="open-options" class="iconbtn" title="Settings" aria-label="Settings">
      <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="2" y1="5" x2="14" y2="5"/><circle cx="6" cy="5" r="2" fill="var(--panel)"/>
        <line x1="2" y1="11" x2="14" y2="11"/><circle cx="10.5" cy="11" r="2" fill="var(--panel)"/>
      </svg>
    </button>
  </header>

  <!-- Only the one-line summary is live. The view is rebuilt on a timer, so
       marking it live would re-announce the whole popup every few seconds. -->
  <p id="status-line" class="visually-hidden" aria-live="polite"></p>
  <main id="view"></main>

  <footer class="row">
    <span class="grow"></span>
    <a class="sub" href="https://s4nt0s.eu" target="_blank" rel="noreferrer">by S4N-T0S</a>
  </footer>

  <script src="../relays.js"></script>
  <script src="../ui/fmt.js"></script>
  <script src="../ui/picker.js"></script>
  <script src="popup.js"></script>
</body>
</html>
