name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # keeps the AMO credentials behind an environment that can require review
    environment: amo
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci --ignore-scripts

      # an AMO version number can never be reused, so refuse to publish a tag
      # that disagrees with the manifest
      - name: Tag must match the manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          mf="$(jq -r .version src/manifest.json)"
          pk="$(jq -r .version package.json)"
          echo "tag=$tag manifest=$mf package=$pk"
          [ "$tag" = "$mf" ] && [ "$mf" = "$pk" ]

      - run: npm run lint
      - run: npm run lint:amo
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx --no-install addons-linter dist/bulkhead-*.zip

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/bulkhead-*.zip

      # Submits the version and waits for signing. The FIRST submission must
      # be done by hand in the AMO web UI, so the listing copy, categories,
      # screenshots and reviewer notes are set deliberately; this workflow is
      # for every version after that.
      - name: Sign and submit to AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # --approval-timeout=0 submits and returns instead of polling for
        # approval. An extension asking for <all_urls> and webRequestBlocking
        # can sit in review for days, and web-ext's default 15-minute wait
        # would fail this job long after the upload it cannot take back.
        run: npx --no-install web-ext sign --channel=listed --source-dir=src --artifacts-dir=dist --approval-timeout=0

      # The zip, not the signed xpi: signing happens on AMO's side and may not
      # have finished yet. This is also the artifact the attestation covers.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/bulkhead-*.zip --generate-notes --verify-tag
