name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # keeps the AMO credentials behind an environment that can require review
    environment: amo
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci --ignore-scripts

      # an AMO version number can never be reused, so refuse to publish a tag
      # that disagrees with the manifest
      - name: Tag must match the manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          mf="$(jq -r .version src/manifest.json)"
          pk="$(jq -r .version package.json)"
          echo "tag=$tag manifest=$mf package=$pk"
          [ "$tag" = "$mf" ] && [ "$mf" = "$pk" ]

      - run: npm run lint
      - run: npm run lint:amo
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx --no-install addons-linter dist/bulkhead-*.zip

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/bulkhead-*.zip

      # Submits the version and waits for signing. The FIRST submission must
      # be done by hand in the AMO web UI, so the listing copy, categories,
      # screenshots and reviewer notes are set deliberately; this workflow is
      # for every version after that.
      - name: Sign and submit to AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx --no-install web-ext sign --channel=listed --source-dir=src --artifacts-dir=dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/bulkhead-*.zip dist/*.xpi --generate-notes --verify-tag
